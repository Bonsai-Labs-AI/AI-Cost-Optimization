name: Deploy to GitHub Pages

on:
  # Build & deploy on every push to main.
  push:
    branches: [main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Permissions the GitHub Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            Agentic-Coding-Token-Optimization/package-lock.json

      - name: Install dependencies (Part 1)
        run: npm ci

      - name: Build Part 1 — Cost Optimization for AI Products
        # GITHUB_ACTIONS=true is set by the runner, so astro.config.mjs applies
        # the project-subpath `base` (/AI-Cost-Optimization) automatically.
        run: npm run build

      - name: Install dependencies (Part 2)
        working-directory: Agentic-Coding-Token-Optimization
        run: npm ci

      - name: Build Part 2 — Token Cost Optimization for Agentic Coding
        # Its astro.config.mjs applies base /AI-Cost-Optimization/agentic-coding in CI,
        # matching the subdirectory it's merged into below.
        working-directory: Agentic-Coding-Token-Optimization
        run: npm run build

      - name: Merge Part 2 into the Pages artifact as a subpage
        run: cp -r Agentic-Coding-Token-Optimization/dist dist/agentic-coding

      - name: Require site password secret
        # Fail fast with a clear message instead of letting StatiCrypt hang
        # waiting for a password prompt when the secret is missing/empty.
        env:
          STATICRYPT_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          if [ -z "$STATICRYPT_PASSWORD" ]; then
            echo "::error::SITE_PASSWORD secret is not set. Add it in repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Password-protect all pages (StatiCrypt)
        # Encrypts every built HTML page in place (assets left untouched) behind
        # one shared password. StatiCrypt reads the password from STATICRYPT_PASSWORD.
        env:
          STATICRYPT_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: npm run protect

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
